[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "book-to-comic"
version = "5.13.6"
description = "Host-native Agent Skill that turns a book into a serialized comic (research, adaptation, paneling, lettering, delivery) in zh-CN or en with no model API key required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "onebluecloud" }]
keywords = ["comic", "manga", "book-adaptation", "agent-skill", "codex", "claude", "chinese"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Chinese (Simplified)",
]
# Pillow floor excludes the GHSA-pwv6-vv43-88gr / GHSA-whj4-6x5x-4v2j range
# (>=10.3,<12.2); content-format allowlisting lives in image_safety.py.
# pypdf/python-docx ship by default: PDF/DOCX upload is a first-screen
# capability and non-technical users cannot be asked to guess package names
# (release audit v5.13.2 P1-3).
dependencies = ["Pillow>=12.3,<13", "jsonschema>=4.18", "pypdf>=4.0", "python-docx>=1.1"]

[project.optional-dependencies]
# Domestic (Cherry Studio / MCP) leg only. The Codex skill does not need this.
mcp = ["mcp>=1.27,<2"]

[project.scripts]
book-to-comic = "book_to_comic.cli:main"
book-to-comic-mcp = "book_to_comic.mcp_server:main"

[tool.setuptools]
packages = ["book_to_comic"]
include-package-data = true

[tool.setuptools.package-data]
book_to_comic = ["presets/*.json", "schemas/*.json", "prompt_templates/*.md"]
